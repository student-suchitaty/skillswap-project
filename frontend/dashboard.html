<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body class="dashboard-layout">

<!-- Sidebar -->

<div class="sidebar">

    <h2>SkillSwap</h2>

    <ul>

        <li>
            <a href="dashboard.html">
                Dashboard
            </a>
        </li>

        <li>
            <a href="addskills.html">
                My Skills
            </a>
        </li>

        <li>
            <a href="findmatches.html">
                Find Matches
            </a>
        </li>

        <li>
            <a href="requests.html">
                Requests
            </a>
        </li>

        <li>
            <a href="profile.html">
                Profile
            </a>
        </li>

        <li>
            <a href="index.html">
                Logout
            </a>
        </li>

    </ul>

</div>

<!-- Main Content -->

<div class="main-content">

    <!-- Topbar -->

    <div class="topbar">

        <h1 id="welcomeMessage">
            Welcome
        </h1>

        <div class="profile">

            <img
src="https://i.pravatar.cc/100">

            <span>
                Student
            </span>

        </div>

    </div>

    <!-- Cards -->

    <div class="cards">

        <div class="card">

            <h3>
                Skills Offered
            </h3>

            <p>5</p>

        </div>

        <div class="card">

            <h3>
                Skills Wanted
            </h3>

            <p>3</p>

        </div>

        <div class="card">

            <h3>
                Matches Found
            </h3>

            <p>12</p>

        </div>

        <div class="card">

            <h3>
                Requests
            </h3>

            <p>4</p>

        </div>

    </div>

    <!-- Skills -->

    <div class="section">

        <h2>
            My Skills
        </h2>

        <div class="skills">

            <div class="skill">
                Java
            </div>

            <div class="skill">
                HTML
            </div>

            <div class="skill">
                CSS
            </div>

            <div class="skill">
                JavaScript
            </div>

            <div class="skill">
                Spring Boot
            </div>

        </div>

    </div>

</div>

<!-- JS -->

<script src="js/dashboard.js"></script>

</body>

</html>
