<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Skills</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Sidebar -->

    <div class="sidebar">

        <h2>SkillSwap</h2>

        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="addskills.html">My Skills</a></li>
            <li><a href="findmatches.html">Find Matches</a></li>
            <li><a href="requests.html">Requests</a></li>
            <li><a href="contact.html">  Contact Admin</a></li>
            <li><a href="studymaterials.html">Study Material</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="index.html">Logout</a></li>
        </ul>

    </div>


    <!-- Main Content -->

    <div class="main-content">

        <div class="section">

            <h2>Add Your Skills</h2>

            <form id="skillForm">

                <!-- Offered Skill -->

                <label for="offeredSkill">
                    Skill You Can Teach
                </label>

                <select id="offeredSkill" required>

                    <option value="">
                        Loading skills...
                    </option>

                </select>


                <!-- Wanted Skill -->

                <label for="wantedSkill">
                    Skill You Want to Learn
                </label>

                <select id="wantedSkill" required>

                    <option value="">
                        Loading skills...
                    </option>

                </select>


                <button type="submit">
                    Add Skills
                </button>

            </form>


            <!-- Request New Skill -->

            <div style="margin-top: 25px;">

                <p>
                    Can't find the skill you want?
                </p>

                <button
                    type="button"
                    onclick="requestNewSkill()">

                    Request a New Skill

                </button>

            </div>

        </div>


        <!-- Current Skills -->

        <div class="section">

            <h2>My Current Skills</h2>

            <div
                class="skills"
                id="currentSkills">

                <p>
                    Your selected skills will appear here.
                </p>

            </div>

        </div>

    </div>


    <script src="js/addskills.js"></script>

</body>
</html>
