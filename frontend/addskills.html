<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Skills</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    

    <!-- Sidebar -->

    <div class="sidebar">

        <h2>SkillSwap</h2>

        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="addskills.html">My Skills</a></li>
            <li><a href="findmatches.html">Find Matches</a></li>
            <li><a href="requests.html">Requests</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="index.html">Logout</a></li>
        </ul>

    </div>

    <!-- Main Content -->

    <div class="main-content">

        <div class="section">

            <h2>Add Your Skills</h2>

            <form id="skillForm">

              <input
                type="text"
                id="offeredSkill"
                placeholder="Enter Skill Offered"
              >

             <input
               type="text"
               id="wantedSkill"
               placeholder="Enter Skill Wanted"
              >

             <button type="submit">
                 Add Skills
            </button>

             </form>
        </div>

        <!-- Skill List -->

        <div class="section">

            <h2>My Current Skills</h2>

            <div class="skills">

                <div class="skill">Java</div>
                <div class="skill">HTML</div>
                <div class="skill">CSS</div>
                <div class="skill">JavaScript</div>

            </div>

        </div>

    </div>
<script src="js/addskills.js"></script>

</body>
</html>
